# Pipeline do agente de codificação: GitHub Actions
# Copie para .github/workflows/coding-agent.yml no repositório deste projeto.
#
# Disparada pela API, pelo Copilot Logístico:
#   POST /repos/{owner}/{repo}/actions/workflows/coding-agent.yml/dispatches
#   { "ref": "main", "inputs": { "request_id": "...", ... } }
# O run-name inclui o request_id para o assistente encontrar a execução depois.

name: coding-agent
run-name: coding-agent ${{ inputs.request_id }}

on:
  workflow_dispatch:
    inputs:
      request_id:
        description: ID da solicitação (gerado pelo assistente)
        required: true
        type: string
      target_repository:
        description: Repositório alvo no formato owner/repo
        required: true
        type: string
      base_branch:
        description: Branch base
        required: false
        default: main
        type: string
      work_branch:
        description: Branch que o agente vai criar
        required: true
        type: string
      task_b64:
        description: Tarefa em JSON, codificada em base64
        required: true
        type: string

permissions:
  contents: read

jobs:
  code:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      TARGET_DIR: ${{ runner.temp }}/target
      TASK_FILE: ${{ runner.temp }}/task.json
      OUTPUT_DIR: ${{ runner.temp }}/agent-result
      CONTAINER_NAME: agent-sandbox-${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: agent-runner/pom.xml

      - name: Compilar agent-runner
        run: mvn -B -q -f agent-runner/pom.xml package -DskipTests

      # Entradas sempre via env, nunca interpoladas direto no script (evita injeção de comandos).
      - name: Ler a tarefa
        run: python3 pipelines/scripts/gitops.py decode-task
        env:
          TASK_B64: ${{ inputs.task_b64 }}
          REQUEST_ID: ${{ inputs.request_id }}

      - name: Clonar repositório alvo
        run: python3 pipelines/scripts/gitops.py clone
        env:
          GIT_PROVIDER: github
          GIT_TOKEN: ${{ secrets.TARGET_REPO_TOKEN }}
          TARGET_REPO_URL: https://github.com/${{ inputs.target_repository }}.git
          BASE_BRANCH: ${{ inputs.base_branch }}
          WORKSPACE_DIR: ${{ env.TARGET_DIR }}

      - name: Preparar sandbox Docker
        run: bash pipelines/scripts/prepare-sandbox.sh
        env:
          WORKSPACE_DIR: ${{ env.TARGET_DIR }}
          SANDBOX_DEFAULT_IMAGE: ${{ vars.SANDBOX_DEFAULT_IMAGE }}

      # Passo do modelo: sem token de Git.
      - name: Rodar agente de codificação
        run: java -jar agent-runner/target/agent-runner.jar
        env:
          OLLAMA_BASE_URL: ${{ secrets.OLLAMA_BASE_URL }}
          OLLAMA_MODEL: ${{ vars.OLLAMA_MODEL || 'llama3.1:8b' }}
          AGENT_WORKSPACE: ${{ env.TARGET_DIR }}
          AGENT_TASK_FILE: ${{ env.TASK_FILE }}
          AGENT_OUTPUT_DIR: ${{ env.OUTPUT_DIR }}
          AGENT_EXECUTOR: docker
          AGENT_CONTAINER: ${{ env.CONTAINER_NAME }}

      - name: Commit, push e PR em rascunho
        run: python3 pipelines/scripts/gitops.py publish
        env:
          GIT_PROVIDER: github
          GIT_TOKEN: ${{ secrets.TARGET_REPO_TOKEN }}
          TARGET_REPO: ${{ inputs.target_repository }}
          WORK_BRANCH: ${{ inputs.work_branch }}
          BASE_BRANCH: ${{ inputs.base_branch }}
          WORKSPACE_DIR: ${{ env.TARGET_DIR }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

      - name: Publicar resultado
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-result
          path: ${{ env.OUTPUT_DIR }}
          if-no-files-found: warn

      - name: Remover sandbox
        if: always()
        run: docker rm -f "$CONTAINER_NAME" || true
