# Acrescente ao application.yml do assistente (ou use como profile "coding-agent").
coding-agent:
  provider: azure            # azure | github
  default-base-branch: main
  artifact-name: agent-result

  azure:
    org-url: https://dev.azure.com/minha-org
    project: MeuProjeto
    pipeline-id: 42          # definitionId da pipeline do agente
    pipeline-ref: main
    pat: ${AZDO_AGENT_PAT}   # escopo: Build (Read & Execute)

  github:
    api-url: https://api.github.com
    agent-repo: minha-org/coding-agent-poc
    workflow-file: coding-agent.yml
    ref: main
    token: ${GITHUB_AGENT_TOKEN}   # Actions: read and write no repositório do agente
