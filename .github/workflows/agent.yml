# Workflow REUTILIZÁVEL do agente de codificação.
#
# Ele não é disparado sozinho: cada repositório que quer usar o agente tem um workflow
# pequeno (templates/target-repo/.github/workflows/coding-agent.yml) que chama este aqui.
# Por ser chamado, ele roda NO CONTEXTO do repositório alvo: o GITHUB_TOKEN é daquele
# repositório e expira no fim do job, então não é preciso nenhum token pessoal para push e PR.
#
# Etapas:
#   1. baixa o repositório alvo e o código do agente
#   2. lê a issue que descreve a tarefa
#   3. garante um Ollama disponível (externo ou iniciado aqui no runner)
#   4. sobe o sandbox Docker do projeto e corta a rede dele
#   5. roda o agente (laço pensa, age, observa)
#   6. commit, push e PR em rascunho ligado à issue
#   7. publica result.json, changes.patch e journal.jsonl como artefato

name: agent

on:
  workflow_call:
    inputs:
      issue_number:
        description: Número da issue com a tarefa
        required: true
        type: number
      request_id:
        description: Id gerado pelo assistente para achar esta execução
        required: true
        type: string
      base_branch:
        description: Branch base
        required: false
        type: string
        default: main
      work_branch:
        description: Branch que o agente vai criar
        required: true
        type: string
      model:
        description: Modelo do Ollama (precisa suportar tools)
        required: false
        type: string
        default: qwen3:4b
      runner:
        description: "ubuntu-latest (nuvem do GitHub) ou self-hosted (sua máquina)"
        required: false
        type: string
        default: ubuntu-latest
      sandbox_image:
        description: Imagem padrão do sandbox, se o repositório não tiver .agent/Dockerfile
        required: false
        type: string
        default: maven:3.9-eclipse-temurin-21
      max_iterations:
        description: Limite de voltas do laço do agente
        required: false
        type: number
        default: 30
      agent_repository:
        description: Repositório onde está este agente
        required: false
        type: string
        default: CaioMC/coding-agent
      agent_ref:
        description: Versão (branch ou tag) do agente
        required: false
        type: string
        default: main
    secrets:
      OLLAMA_BASE_URL:
        description: Ollama externo. Se vazio, o workflow instala e roda o Ollama no próprio runner.
        required: false

jobs:
  code:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 90
    permissions:
      contents: write
      pull-requests: write
      issues: write
    env:
      TARGET_DIR: ${{ github.workspace }}/target
      AGENT_DIR: ${{ github.workspace }}/agent
      TASK_FILE: ${{ runner.temp }}/task.json
      OUTPUT_DIR: ${{ runner.temp }}/agent-result
      CONTAINER_NAME: agent-sandbox-${{ github.run_id }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      # 1. Código: o repositório alvo (onde o agente vai trabalhar) e o próprio agente.
      - name: Baixar repositório alvo
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.base_branch }}
          path: target
          fetch-depth: 50
          persist-credentials: false   # o token NÃO fica no .git/config que o agente enxerga

      - name: Baixar código do agente
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.agent_repository }}
          ref: ${{ inputs.agent_ref }}
          path: agent
          persist-credentials: false

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: agent/agent-runner/pom.xml

      - name: Compilar agent-runner
        run: mvn -B -q -f "$AGENT_DIR/agent-runner/pom.xml" package -DskipTests

      # 2. A tarefa é a issue. Também comenta na issue que o trabalho começou.
      - name: Ler a issue
        run: python3 "$AGENT_DIR/scripts/gitops.py" fetch-issue
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
          REQUEST_ID: ${{ inputs.request_id }}

      # 3. Modelo. Com o secret OLLAMA_BASE_URL, usa um Ollama externo (GPU, servidor da empresa).
      #    Sem ele, instala o Ollama aqui mesmo: é lento (CPU), mas deixa a POC rodando sem infra.
      - name: Cache dos modelos do Ollama
        if: inputs.runner == 'ubuntu-latest'
        uses: actions/cache@v4
        with:
          path: ~/.ollama/models
          key: ollama-${{ inputs.model }}

      - name: Preparar Ollama
        run: bash "$AGENT_DIR/scripts/setup-ollama.sh"
        env:
          EXTERNAL_OLLAMA_URL: ${{ secrets.OLLAMA_BASE_URL }}
          OLLAMA_MODEL: ${{ inputs.model }}

      # 4. Sandbox: container do projeto, dependências instaladas, rede cortada.
      - name: Preparar sandbox Docker
        run: bash "$AGENT_DIR/scripts/prepare-sandbox.sh"
        env:
          WORKSPACE_DIR: ${{ env.TARGET_DIR }}
          SANDBOX_DEFAULT_IMAGE: ${{ inputs.sandbox_image }}

      # 5. O agente. Repare: este passo NÃO recebe o GITHUB_TOKEN.
      - name: Rodar agente de codificação
        run: java -jar "$AGENT_DIR/agent-runner/target/agent-runner.jar"
        env:
          OLLAMA_MODEL: ${{ inputs.model }}
          AGENT_WORKSPACE: ${{ env.TARGET_DIR }}
          AGENT_TASK_FILE: ${{ env.TASK_FILE }}
          AGENT_OUTPUT_DIR: ${{ env.OUTPUT_DIR }}
          AGENT_EXECUTOR: docker
          AGENT_CONTAINER: ${{ env.CONTAINER_NAME }}
          AGENT_MAX_ITERATIONS: ${{ inputs.max_iterations }}

      # 6. Publicação: só aqui o token de escrita aparece.
      - name: Commit, push e PR em rascunho
        run: python3 "$AGENT_DIR/scripts/gitops.py" publish
        env:
          GH_TOKEN: ${{ github.token }}
          WORKSPACE_DIR: ${{ env.TARGET_DIR }}
          WORK_BRANCH: ${{ inputs.work_branch }}
          BASE_BRANCH: ${{ inputs.base_branch }}

      # 7. O assistente baixa este artefato para mostrar o resultado no chat.
      - name: Publicar resultado
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-result
          path: ${{ env.OUTPUT_DIR }}
          if-no-files-found: warn

      - name: Remover sandbox
        if: always()
        run: docker rm -f "$CONTAINER_NAME" || true
